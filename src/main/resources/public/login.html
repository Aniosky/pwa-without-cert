<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PWA Login">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>PWA Login</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" sizes="192x192" href="/icons/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f2ec;
      --ink: #16222d;
      --muted: #65727f;
      --line: #d8d2c8;
      --panel: #ffffff;
      --teal: #0f4c5c;
      --amber: #b36b00;
      --red: #b23a48;
      --green: #1f7a55;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(15, 76, 92, 0.1), rgba(15, 76, 92, 0) 280px),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0 24px;
    }

    .eyebrow,
    .label {
      margin: 0;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 760;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      margin-top: 4px;
      font-size: clamp(2.2rem, 8vw, 4.8rem);
      line-height: 0.95;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.15;
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .pill {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      color: var(--teal);
      background: rgba(255, 255, 255, 0.78);
      font-size: 0.82rem;
      font-weight: 760;
      white-space: nowrap;
    }

    .pill-muted {
      min-height: 28px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.62fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(22, 34, 45, 0.08);
    }

    .login-panel {
      padding: 22px;
    }

    .notice {
      display: none;
      border: 1px solid rgba(178, 58, 72, 0.35);
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 13px 14px;
      color: #7d2330;
      background: rgba(178, 58, 72, 0.08);
      line-height: 1.42;
    }

    body[data-login-source="cache"] .notice {
      display: block;
    }

    body[data-login-source="cache"] .notice {
      border-color: rgba(179, 107, 0, 0.4);
      color: #704300;
      background: rgba(179, 107, 0, 0.1);
    }

    .form {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 760;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: #fbfaf7;
      outline: none;
    }

    .field input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 76, 92, 0.14);
    }

    .button {
      min-height: 46px;
      border: 1px solid var(--teal);
      border-radius: 8px;
      padding: 0 16px;
      color: #fff;
      background: var(--teal);
      font-weight: 780;
      cursor: pointer;
    }

    .status-panel {
      padding: 18px;
    }

    .status-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .status-list li {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fbfaf7;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      margin-top: 4px;
      background: var(--green);
    }

    body[data-login-source="cache"] .dot {
      background: var(--amber);
    }

    .status-list strong,
    .status-list span {
      display: block;
    }

    .status-list strong {
      font-size: 0.94rem;
    }

    .status-list span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.38;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .shell {
        padding-inline: 12px;
      }

      .topbar,
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
      }

      .meta {
        align-items: flex-start;
      }

      .login-panel,
      .status-panel {
        padding: 16px;
      }
    }
  </style>
</head>
<body data-login-source="primary" data-login-version="2026-07-13.12">
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PWA / Login</p>
        <h1>PWA Login</h1>
      </div>
      <div class="meta">
        <div class="pill" id="displayMode">Safari</div>
        <div class="pill pill-muted" id="versionPill">v2026-07-13.12</div>
      </div>
    </header>

    <section class="layout" aria-live="polite">
      <article class="panel login-panel">
        <p class="label">Вход</p>
        <h2>Авторизация</h2>

        <form class="form" id="loginForm">
          <div class="field">
            <label for="login">Логин</label>
            <input id="login" name="login" autocomplete="username" inputmode="email" placeholder="user@example.com">
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="button" type="submit">Войти</button>
        </form>
      </article>

      <aside class="panel status-panel">
        <p class="label">Источник страницы</p>
        <h2 id="sourceTitle">Основной домен</h2>
        <ul class="status-list">
          <li>
            <span class="dot"></span>
            <div>
              <strong id="sourceValue">primary</strong>
              <span id="sourceDetail">Страница логина загружена напрямую с основного сервера.</span>
            </div>
          </li>
          <li>
            <span class="dot"></span>
            <div>
              <strong id="originValue">-</strong>
              <span>Текущий origin PWA.</span>
            </div>
          </li>
        </ul>
      </aside>
    </section>
  </main>

  <script>
    (() => {
      const version = document.body.dataset.loginVersion || "2026-07-13.12";
      const source = document.body.dataset.loginSource || "primary";
      const displayMode = document.querySelector("#displayMode");
      const versionPill = document.querySelector("#versionPill");
      const sourceTitle = document.querySelector("#sourceTitle");
      const sourceValue = document.querySelector("#sourceValue");
      const sourceDetail = document.querySelector("#sourceDetail");
      const originValue = document.querySelector("#originValue");

      displayMode.textContent = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches
        ? "Home Screen"
        : "Safari";
      versionPill.textContent = `v${version}`;
      originValue.textContent = window.location.origin;
      sourceValue.textContent = source;

      if (source === "cache") {
        sourceTitle.textContent = "Кэш";
        sourceDetail.textContent = "Свежая страница логина недоступна, показана сохраненная копия.";
      }

      document.querySelector("#loginForm").addEventListener("submit", (event) => {
        event.preventDefault();
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register(`/sw.js?v=${encodeURIComponent(version)}`, { scope: "/", updateViaCache: "all" }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
